<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e293b'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JurisCopilot — AI Legal Document Drafting Studio</title>
    <!-- Google Fonts for Devanagari and Latin -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="font-family:sans-serif;padding:32px;max-width:600px;margin:50px auto;background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">'
            + '<h2 style="color:#e11d48;margin:0 0 12px;font-size:20px;">Startup Error</h2>'
            + '<p style="color:#475569;font-size:14px;line-height:1.5;">' + (e.message || 'An error occurred during application startup.') + '</p>'
            + '<pre style="background:#f8fafc;padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;color:#334155;">' + (e.error ? e.error.stack : '') + '</pre>'
            + '<button onclick="location.reload()" style="margin-top:16px;background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;">Reload Page</button>'
            + '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
